name: Build & Release WannaCry Forensic Lab

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable with PyInstaller
        run: |
          pyinstaller --onefile --windowed `
            --name "WannaCry_Forensic_Lab" `
            --add-data "gui;gui" `
            --add-data "simulation;simulation" `
            --add-data "forensics;forensics" `
            --add-data "database;database" `
            --hidden-import customtkinter `
            --hidden-import PIL `
            --hidden-import matplotlib `
            --hidden-import sqlite3 `
            main.py

      - name: Create release directories in dist
        run: |
          New-Item -ItemType Directory -Force -Path dist\cases | Out-Null
          New-Item -ItemType Directory -Force -Path dist\reports | Out-Null
          Copy-Item README.md dist\
          Copy-Item requirements.txt dist\
          Compress-Archive -Path dist\* -DestinationPath WannaCry_Forensic_Lab_Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WannaCry_Forensic_Lab_Windows
          path: WannaCry_Forensic_Lab_Windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "WannaCry Forensic Investigation Lab ${{ github.ref_name }}"
          body: |
            ## WannaCry Forensic Investigation Lab

            > **EDUCATIONAL SIMULATION — NO REAL MALWARE**

            ### Download & Run (Windows)
            1. Download `WannaCry_Forensic_Lab_Windows.zip`
            2. Extract the archive
            3. Double-click `WannaCry_Forensic_Lab.exe`

            **No Python installation required — standalone executable.**

            ### Or run from source
            ```bash
            pip install -r requirements.txt
            python main.py
            ```

            ### What's included
            - 4-stage WannaCry-style attack simulation (safe sandbox)
            - Complete digital forensic investigation workflow
            - SHA-256 evidence integrity verification
            - Attack timeline reconstruction from 6 evidence sources
            - 12-section structured forensic case analysis report
          files: WannaCry_Forensic_Lab_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Tkinter + display)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests (headless)
        run: python tests/test_backend.py

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ubuntu
          path: cases/
